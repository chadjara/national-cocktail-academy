name: iOS

# Builds the iOS app for the simulator and launches it, on every PR that could
# affect it. This is the only real WebKit check of the app shell (ADR-0009).
on:
  pull_request:
    paths:
      - "ios/**"
      - "src/**"
      - "capacitor.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator:
    name: Simulator build and launch
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec cap sync ios
      - name: Build for the iOS simulator
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO
      - name: Launch in the simulator
        run: scripts/ios/simulator-smoke.sh ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app ios-smoke
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke
          path: ios-smoke
          retention-days: 7
