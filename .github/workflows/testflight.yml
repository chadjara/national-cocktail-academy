name: TestFlight

# Archives, signs and uploads the iOS app to App Store Connect.
# Run it from the Actions tab, or push a version tag (e.g. v0.2.0).
# Signing is cloud-managed by Apple through the App Store Connect API key,
# so there are no certificates or profiles in the repo (ADR-0009).
on:
  workflow_dispatch:
    inputs:
      attempt:
        description: "Set automatically when a run is retried because no macOS runner was available"
        required: false
        default: "1"
  push:
    tags: ["v*"]

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    name: Build and upload to TestFlight
    # GitHub's Apple Silicon macOS pools (macos-15, macos-26) have been unable to
    # hand out runners since late October 2026. The Intel pool is separate and its
    # macOS 15 image ships Xcode 26.3, which meets Apple's iOS 26 SDK requirement.
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check the signing secrets are set
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          missing=()
          for name in ASC_API_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. Add them under Settings → Secrets and variables → Actions (see README, iOS / TestFlight)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec cap sync ios
      - name: Write the App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"
      - name: Archive
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Archiving NCA $VERSION (build $GITHUB_RUN_NUMBER)"
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NCA.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
      - name: Export and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/NCA.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded. The build appears in App Store Connect → TestFlight after Apple finishes processing (usually 5–30 minutes)."
      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

  # GitHub sometimes can't hand out a macOS runner at all; the upload job then
  # ends after ~15 minutes without running a single step. Re-dispatch the
  # workflow (up to 3 attempts) in that case only. Real build failures, which
  # do run steps, are left for a human to read.
  retry-unacquired:
    name: Retry if no macOS runner was available
    needs: upload
    if: always() && needs.upload.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      ATTEMPT: ${{ inputs.attempt || '1' }}
    steps:
      - name: Re-dispatch when the upload job never got a runner
        run: |
          steps=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '[.jobs[] | select(.name == "Build and upload to TestFlight") | .steps | length] | first // 0')
          if [ "$steps" != "0" ]; then
            echo "The upload job ran $steps steps, so this was a real failure. Not retrying."
            exit 0
          fi
          if [ "$ATTEMPT" -ge 3 ]; then
            echo "::error::No macOS runner after $ATTEMPT attempts. Try again later."
            exit 1
          fi
          next=$((ATTEMPT + 1))
          echo "No macOS runner was available. Dispatching attempt $next."
          gh workflow run testflight.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f attempt="$next"
